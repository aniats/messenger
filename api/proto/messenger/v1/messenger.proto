syntax = "proto3";
package messenger.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";

option go_package = "messenger/pkg/messenger/v1";

service Messenger {
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);
  rpc CreateChat(CreateChatRequest) returns (CreateChatResponse);
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
  rpc GetHistory(GetHistoryRequest) returns (GetHistoryResponse);
}

message CreateSessionRequest {}

message CreateSessionResponse {
  string session_id = 1;
}

message CreateChatRequest {
  string session_id = 1;
  string name = 2;
  optional bool is_read_only = 3;
  optional google.protobuf.Duration chat_ttl = 4;
  optional google.protobuf.Duration message_ttl = 5;
  optional int32 max_messages = 6;
}

message CreateChatResponse {
  string chat_id = 1;
}

message SendMessageRequest {
  string session_id = 1;
  string chat_id = 2;
  string text = 3;
}

message SendMessageResponse {}

message GetHistoryRequest {
  string session_id = 1;
  string chat_id = 2;
  int32 offset = 3;
  int32 limit = 4;
}

message GetHistoryResponse {
  repeated ChatMessage messages = 1;
  int32 total_count = 2;
}

message ChatMessage {
  string message_id = 1;
  string sender_id = 2;
  string text = 3;
  google.protobuf.Timestamp sent_at = 4;
}